# Smart EDMS — Docker Compose for LAN deployment
#
# Scenario: Single server on enterprise LAN with outbound internet access.
# Inbound: only from LAN (ports 80/443 via Caddy).
# Outbound: internet available (for updates, LLM API, optional SMTP, ClamAV sigs).
#
# Services included:
#   - caddy       (reverse proxy + automatic internal-CA TLS)
#   - app         (Next.js production server)
#   - worker      (BullMQ background jobs: OCR, webhooks, evidence, reindex)
#   - postgres    (primary database)
#   - redis       (rate limiting + job queue)
#   - clamav      (malware scanning)
#   - minio       (S3-compatible object storage for documents)
#   - opensearch  (semantic + full-text search)
#
# Usage:
#   1. cp .env.lan.template .env  &&  fill in secrets
#   2. docker compose -f docker-compose.lan.yml up -d --build
#   3. docker compose -f docker-compose.lan.yml exec app npx prisma migrate deploy
#   4. docker compose -f docker-compose.lan.yml exec app bun run seed
#
# See docs/LAN-DEPLOYMENT.md for the full guide.

services:
  # ===========================================================================
  # Caddy — reverse proxy with automatic TLS
  # ===========================================================================
  # For internal hostnames (smartedms.internal.company.dz), Caddy uses its
  # internal CA. Distribute the root CA cert to employee machines via GPO/MDM.
  # For real domains with public DNS, Caddy uses Let's Encrypt automatically.
  # To use your enterprise CA, mount certs and set tls in Caddyfile.
  caddy:
    image: caddy:2-alpine
    container_name: smartedms-caddy
    restart: unless-stopped
    ports:
      - "80:80"   # HTTP → redirects to HTTPS
      - "443:443" # HTTPS
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      # Mount enterprise CA certs here if using your own (see Caddyfile)
      # - ./certs:/certs:ro
    depends_on:
      - app
    networks:
      - smartedms

  # ===========================================================================
  # App — Next.js production server (standalone output)
  # ===========================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartedms-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Database
      DATABASE_URL: postgresql://smartedms:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/smartedms?schema=public

      # Redis (rate limiting + BullMQ job queue)
      REDIS_URL: redis://redis:6379

      # ClamAV (malware scanning)
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"

      # NextAuth
      NEXTAUTH_URL: ${NEXTAUTH_URL:?NEXTAUTH_URL is required}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}

      # Key Encryption Key (32 bytes hex) — for AES-256-GCM envelope encryption
      SMART_EDMS_KEK: ${SMART_EDMS_KEK:?SMART_EDMS_KEK is required}

      # Storage — MinIO (S3-compatible) for LAN deployments
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: smartedms
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      S3_FORCE_PATH_STYLE: "true"

      # AI (optional — works because server has internet egress)
      AI_API_KEY: ${AI_API_KEY:-}
      AI_LLM_ENABLED: ${AI_LLM_ENABLED:-true}

      # Cron (scheduled tasks: workflow escalation, billing reconciliation)
      CRON_SECRET: ${CRON_SECRET:?CRON_SECRET is required}

      # Metrics (bearer-token protected)
      METRICS_TOKEN: ${METRICS_TOKEN:-}

      # WebSocket internal auth
      WS_INTERNAL_SECRET: ${WS_INTERNAL_SECRET:?WS_INTERNAL_SECRET is required}
      WS_SERVICE_URL: http://app:3000

      # SMTP (email notifications — internal relay or external service)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Smart EDMS <noreply@smartedms.local>}

      # OpenSearch (semantic + full-text search)
      OPENSEARCH_HOST: http://opensearch:9200

      # Sentry (optional error tracking — works via internet egress)
      SENTRY_DSN: ${SENTRY_DSN:-}

      # Web Push (optional — may not work behind corporate proxies)
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:noreply@smartedms.local}

      # CORS (empty = same-origin only, which is what we want for LAN)
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-}

      # Node
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - app_storage:/app/storage
    expose:
      - "3000"  # Only exposed to Caddy, not to the host
    networks:
      - smartedms

  # ===========================================================================
  # Worker — background job processor (OCR, webhooks, evidence, reindex)
  # ===========================================================================
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartedms-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["bun", "run", "src/worker/index.ts"]
    environment:
      DATABASE_URL: postgresql://smartedms:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/smartedms?schema=public
      REDIS_URL: redis://redis:6379
      NEXTAUTH_URL: ${NEXTAUTH_URL:?NEXTAUTH_URL is required}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      SMART_EDMS_KEK: ${SMART_EDMS_KEK:?SMART_EDMS_KEK is required}
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: smartedms
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      S3_FORCE_PATH_STYLE: "true"
      AI_API_KEY: ${AI_API_KEY:-}
      AI_LLM_ENABLED: ${AI_LLM_ENABLED:-true}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      OPENSEARCH_HOST: http://opensearch:9200
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - app_storage:/app/storage
    networks:
      - smartedms

  # ===========================================================================
  # PostgreSQL — primary database
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: smartedms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartedms
      POSTGRES_USER: smartedms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartedms -d smartedms"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Do NOT expose 5432 to the host — only internal to the Docker network.
    # To access from the host for maintenance, use:
    #   docker compose -f docker-compose.lan.yml exec postgres psql -U smartedms -d smartedms
    networks:
      - smartedms

  # ===========================================================================
  # Redis — rate limiting + BullMQ job queue
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: smartedms-redis
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy noeviction --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smartedms

  # ===========================================================================
  # ClamAV — malware scanning (signature updates via internet egress)
  # ===========================================================================
  clamav:
    image: clamav/clamav:latest
    container_name: smartedms-clamav
    restart: unless-stopped
    volumes:
      - clamav_data:/var/lib/clamav
    networks:
      - smartedms

  # ===========================================================================
  # MinIO — S3-compatible object storage for documents
  # ===========================================================================
  # Access the MinIO console at https://smartedms.internal.company.dz:9001
  # (or via SSH tunnel: ssh -L 9001:localhost:9001 admin@server-ip)
  minio:
    image: minio/minio:latest
    container_name: smartedms-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio_data:/data
    ports:
      - "9001:9001"  # Console — restrict to LAN via firewall if needed
    networks:
      - smartedms

  # ===========================================================================
  # OpenSearch — semantic + full-text search with Arabic analyzers
  # ===========================================================================
  # Requires vm.max_map_count=262144 on the host:
  #   sudo sysctl -w vm.max_map_count=262144
  #   echo "vm.max_map_count=262144" | sudo tee -a /etc/sysctl.conf
  opensearch:
    image: opensearchproject/opensearch:2.13.0
    container_name: smartedms-opensearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
      - "DISABLE_SECURITY_PLUGIN=true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks:
      - smartedms

volumes:
  postgres_data:
  app_storage:
  minio_data:
  opensearch_data:
  redis_data:
  clamav_data:
  caddy_data:
  caddy_config:

networks:
  smartedms:
    driver: bridge
